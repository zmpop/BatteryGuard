# ============================================================
#  Battery Guard 配置文件
#  路径：/data/adb/battery-guard/battery-guard.conf
#  修改后无需重启，守护进程会在下一个轮询周期自动热重载（约 30s 内）
#  修改示例：
#    adb shell
#    su -c "sed -i 's/^UPPER_LIMIT=.*/UPPER_LIMIT=85/' /data/adb/battery-guard/battery-guard.conf"
#  或用 MT 管理器 / _ROOT 文件管理器以 root 直接编辑本文件
#  语法：KEY=VALUE，等号两侧不要加空格，# 开头为注释
# ============================================================

# -------- 1. 核心阈值 --------
# 上限电量：到达该值时停止充电
UPPER_LIMIT=80
# 下限电量：低于该值时恢复充电（充到上限后再次停止）
# 上限与下限之间的间隔就是滞回区间，模块会强制保证间隔 >= 5%
LOWER_LIMIT=40

# -------- 2. 轮询与防抖 --------
# 轮询间隔（秒）：读取电量的频率。30~60 秒足够，太小会增加耗电
POLL_INTERVAL=30
# 最小切换间隔（秒）：两次充电状态切换之间必须等待的时间，防止频繁抖动
MIN_SWITCH_INTERVAL=120
# 连续满足条件 N 次才真正动作（配合上面的轮询间隔，过滤瞬间跳变）
CONFIRM_COUNT=1
# 重新写入节点的时间间隔（秒）：部分内核会自行复位节点，定期重断言保证有效
REASSERT_SEC=120

# -------- 3. 行为开关 --------
# 总开关：0=只记录日志不改变充电状态
ENABLED=1
# 仅在连接充电器时才控制；拔掉充电器时会恢复系统默认充电行为
ONLY_WHEN_PLUGGED=1
# 调试用：1=只写日志不真正写入节点（可以用来验证逻辑而不影响充电）
DRY_RUN=0

# -------- 4. 节点策略 --------
# 自动探测时各类节点的优先顺序，逗号分隔
#   direct        = 写 1 充电 / 写 0 停充，如 charging_enabled
#   invert        = 写 0 充电 / 写 1 停充，如 input_suspend、store_mode
#   current_limit = 通过把输入电流限制到极小值实现停充（兜底方案）
NODE_PREFERENCE=direct,invert,current_limit
# 手动指定节点，留空为自动探测。格式：类型:路径
# 例：FORCE_NODE=invert:/sys/class/power_supply/battery/input_suspend
FORCE_NODE=
# 使用 current_limit 类节点时，停充写入的电流值（0 = 断流）
CURRENT_LIMIT_VALUE=0
# 是否信任 /sys/class/power_supply/usb/online 作为"已插充电器"的依据
# 三星平板（如 Tab S7+）该节点常年为 1，造成未插电也误判为已连接，故默认不采信
# 如果你的设备只靠 USB 供电且插拔时该节点确实会变化，改成 1
TRUST_USB_ONLINE=0
# 是否信任三星的 battery/charging_type 作为依据（未插电=NONE，插 PD 充电器=PDIC）
TRUST_CHARGING_TYPE=1
# 是否信任三星的 battery/batt_charging_source 位掩码作为依据（未插电=1，插 PD=19）
TRUST_CHARGING_SOURCE=1
# 探测时是否执行"写测试值并回读校验"（默认 1，能过滤掉只读/空实现的假节点）
PROBE_WRITE_TEST=1

# -------- 5. 日志 --------
# 日志文件：/data/adb/battery-guard/battery-guard.log
# 单文件保留的最大行数，超出后保留后半部分
LOG_MAX_LINES=2000
# 每 N 个轮询周期输出一条心跳日志（记录电量/策略，便于确认守护存活）
LOG_HEARTBEAT=20
# 是否同步输出到 logcat（tag: BatteryGuard）
LOG_TO_LOGCAT=1
# 是否记录探测细节等详细信息
LOG_VERBOSE=1

# -------- 6. 其他 --------
# 守护进程异常退出后的重启延时（秒）
RESTART_DELAY=30
# 是否在 post-fs-data 阶段（开机早期）就启动守护；0=等开机完成后由 service.sh 启动
# 想在开机动画阶段就生效可改为 1（少数机型早期 sysfs 未就绪，会由 service.sh 兜底）
EARLY_START=0
