<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<!-- 本地页面随模块升级会变：禁止浏览器缓存旧副本 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Battery Guard · 充电阈值</title>
<style>
  :root{
    --bg:#f2f4f7; --card:#ffffff; --text:#14171a; --muted:#6b7280;
    --line:rgba(0,0,0,.08); --accent:#2563eb; --accent-soft:#e8efff;
    --ok:#0f9d58; --warn:#d97706; --danger:#dc2626;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1116; --card:#171b21; --text:#e8eaed; --muted:#9aa3ae;
      --line:rgba(255,255,255,.10); --accent:#5b9dff; --accent-soft:#16233a;
      --ok:#34c759; --warn:#f0a020; --danger:#ff5f56;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:18px 16px 32px;background:var(--bg);color:var(--text);
    font-family:-apple-system,"SF Pro SC","PingFang SC","Noto Sans CJK SC",Roboto,sans-serif;
    font-size:15px;line-height:1.55;
  }
  .wrap{max-width:560px;margin:0 auto}
  /* 平板横屏：状态与设置左列、日志右列，避免内容挤在中间一条 */
  @media (min-width:800px){
    .wrap{max-width:900px;display:grid;grid-template-columns:1.15fr 1fr;gap:14px;align-items:start}
    header{grid-column:1 / -1;margin-bottom:2px}
    .card{margin-bottom:0}
    footer{grid-column:1 / -1;margin-top:6px}
    pre{max-height:360px}
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 4px 16px}
  .cap{font-size:44px;font-weight:600;letter-spacing:-1.5px;line-height:1}
  .cap small{font-size:18px;font-weight:500;color:var(--muted);margin-left:2px}
  .head-right{text-align:right}
  .chip{
    display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;
    background:var(--accent-soft);color:var(--accent);font-weight:500;
  }
  .chip.stop{background:rgba(217,119,6,.14);color:var(--warn)}
  .chip.off{background:rgba(107,114,128,.16);color:var(--muted)}
  .sub{font-size:12px;color:var(--muted);margin-top:6px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px 16px;margin-bottom:14px;
  }
  .card h2{margin:0 0 14px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
  .card h2 span{font-size:12px;font-weight:400;color:var(--muted)}
  .field{margin-bottom:20px}
  .field:last-of-type{margin-bottom:14px}
  .field-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .field-head label{font-size:14px;color:var(--muted)}
  .val{font-size:26px;font-weight:600;letter-spacing:-.5px}
  .val small{font-size:14px;color:var(--muted);font-weight:400}
  input[type=range]{
    -webkit-appearance:none;width:100%;height:34px;background:transparent;margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:6px;border-radius:99px;background:var(--line);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:26px;height:26px;border-radius:50%;
    background:#fff;border:2px solid var(--accent);margin-top:-10px;
    box-shadow:0 1px 4px rgba(0,0,0,.18);
  }
  .axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-4px}
  .zone{
    margin:2px 0 16px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);
    font-size:13px;color:var(--accent);display:flex;justify-content:space-between;gap:8px;
  }
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .presets button{
    flex:1 1 0;min-width:96px;padding:9px 8px;border-radius:10px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--text);
    font-size:13px;font-family:inherit;
  }
  .presets button small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  .presets button:active{background:var(--accent-soft)}
  .save{
    width:100%;padding:14px;border:none;border-radius:12px;cursor:pointer;
    background:var(--accent);color:#fff;font-size:16px;font-weight:600;font-family:inherit;
  }
  .save:disabled{opacity:.45}
  .save:active:not(:disabled){transform:scale(.995)}
  .msg{min-height:20px;margin:10px 2px 0;font-size:13px;color:var(--muted)}
  .msg.ok{color:var(--ok)}
  .msg.err{color:var(--danger)}
  pre{
    margin:0;padding:12px;border-radius:10px;background:rgba(127,127,127,.08);
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px;
    line-height:1.65;white-space:pre-wrap;word-break:break-all;
    max-height:230px;overflow:auto;color:var(--muted);
  }
  footer{text-align:center;font-size:11px;color:var(--muted);margin-top:6px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="cap"><span id="cap">--</span><small>%</small></div>
    <div class="head-right">
      <div id="stateChip" class="chip">读取中</div>
      <div class="sub" id="nodeInfo">—</div>
    </div>
  </header>

  <section class="card">
    <h2>充电区间 <span id="plugInfo">—</span></h2>

    <div class="field">
      <div class="field-head">
        <label>上限 · 到达后停止充电</label>
        <div class="val"><span id="uVal">80</span><small>%</small></div>
      </div>
      <input id="uRange" type="range" min="20" max="100" step="1" value="80" aria-label="充电上限">
      <div class="axis"><span>20%</span><span>100%</span></div>
    </div>

    <div class="field">
      <div class="field-head">
        <label>下限 · 低于后恢复充电</label>
        <div class="val"><span id="lVal">40</span><small>%</small></div>
      </div>
      <input id="lRange" type="range" min="5" max="95" step="1" value="40" aria-label="充电下限">
      <div class="axis"><span>5%</span><span>95%</span></div>
    </div>

    <div class="zone">
      <span>放电深度 <b id="dod">40</b>%</span>
      <span>平均电量 <b id="avg">60</b>%</span>
    </div>

    <div class="presets">
      <button data-u="75" data-l="45">45 – 75<small>长期插电推荐</small></button>
      <button data-u="80" data-l="40">40 – 80<small>通用</small></button>
      <button data-u="70" data-l="50">50 – 70<small>最保守</small></button>
    </div>

    <button id="save" class="save" disabled>保存并生效</button>
    <p class="msg" id="msg">拖动滑块或选择预设，然后点保存</p>
  </section>

  <section class="card">
    <h2>最近记录 <span id="logHint">—</span></h2>
    <pre id="log">加载中…</pre>
  </section>

  <footer>
    守护进程在后台独立运行，关闭本页面不影响充电控制<br>
    <span id="ttlInfo">面板启动后固定 5 分钟自动关闭（不因页面活动延长）</span>
  </footer>
</div>

<script>
const MOD = '/data/adb/modules/battery_guard';
const hasBridge = !!(window.ksu && typeof window.ksu.exec === 'function') || !!window.ksud;

async function sh(cmd){
  if (window.ksu && ksu.exec){
    const r = await ksu.exec(cmd);
    return (r && (r.stdout ?? r)) || '';
  }
  throw new Error('no bridge');
}
async function apiState(){
  try{
    return JSON.parse(await sh(`sh -c '. ${MOD}/common/api.sh; api_state_json'`));
  }catch(e){
    const r = await fetch('cgi-bin/state', {cache:'no-store'});
    return r.json();
  }
}
async function apiSet(u,l){
  try{
    return JSON.parse(await sh(`sh -c '. ${MOD}/common/api.sh; api_set ${u} ${l}'`));
  }catch(e){
    const r = await fetch(`cgi-bin/set?u=${u}&l=${l}`, {cache:'no-store'});
    return r.json();
  }
}
async function apiLog(){
  try{
    return await sh(`tail -n 14 /data/adb/battery-guard/battery-guard.log 2>/dev/null || echo 暂无日志`);
  }catch(e){
    return await (await fetch('cgi-bin/log', {cache:'no-store'})).text();
  }
}

const $ = id => document.getElementById(id);
const uR = $('uRange'), lR = $('lRange');
let saved = {u:80, l:40};
// 面板关闭时刻（浏览器本地时间，毫秒）；0 = 未获取到 / 常驻模式
let ttlAt = 0;

function paintTtl(){
  const el = $('ttlInfo');
  if (!ttlAt) return;
  const left = Math.max(0, Math.round((ttlAt - Date.now()) / 1000));
  if (left <= 0){
    el.textContent = '存活时间已到，面板正在关闭…';
    return;
  }
  const m = Math.floor(left / 60), s = left % 60;
  const human = m > 0 ? m + ' 分 ' + s + ' 秒' : s + ' 秒';
  el.textContent = '面板将在 ' + human + ' 后自动关闭（固定时长，再点模块「操作」重新计时）';
}

function paint(){
  const u = +uR.value, l = +lR.value;
  $('uVal').textContent = u;
  $('lVal').textContent = l;
  $('dod').textContent = u - l;
  $('avg').textContent = Math.round((u + l) / 2);
  $('save').disabled = (u === saved.u && l === saved.l);
}

function clampLower(){
  const u = +uR.value;
  if (+lR.value > u - 5) lR.value = u - 5;
  if (+lR.value < 5) lR.value = 5;
}
function clampUpper(){
  const l = +lR.value;
  if (+uR.value < l + 5) uR.value = l + 5;
}

uR.addEventListener('input', () => { clampLower(); paint(); });
lR.addEventListener('input', () => { clampUpper(); paint(); });

document.querySelectorAll('.presets button').forEach(b => {
  b.addEventListener('click', () => {
    uR.value = b.dataset.u;
    lR.value = b.dataset.l;
    paint();
  });
});

async function refresh(){
  try{
    const s = await apiState();
    $('cap').textContent = s.cap;
    const chip = $('stateChip');
    chip.textContent = s.daemon ? s.state : '守护未运行';
    chip.className = 'chip' + (s.state && s.state.indexOf('停止') === 0 ? ' stop' : (s.daemon ? '' : ' off'));
    $('plugInfo').textContent = s.plugged === 1 ? '充电器已连接' : '未插充电器';
    $('nodeInfo').textContent = s.kind === 'none' ? '未探测到控制节点' : (s.nodeDesc + ' · ' + s.node.split('/').pop());
    $('logHint').textContent = s.poll + 's 轮询';
    // 底部：按接口给的剩余秒数换算成本地截止时刻，之后每 1 秒本地递减（不用额外请求）
    if ((+s.ttl || 0) > 0 && (+s.remain || 0) > 0){
      ttlAt = Date.now() + s.remain * 1000;
      paintTtl();
    }else{
      ttlAt = 0;
      $('ttlInfo').textContent = (+s.ttl || 0) > 0
        ? '存活时间已到，面板正在关闭…'
        : '面板为常驻模式，不会自动关闭';
    }
    // 首次加载时用设备上的真实值初始化滑块
    if (s.upper && !window.__inited){
      window.__inited = true;
      saved = {u: s.upper, l: s.lower};
      uR.value = s.upper; lR.value = s.lower; paint();
    }
  }catch(e){
    $('stateChip').textContent = '连接失败';
    $('stateChip').className = 'chip off';
    // 面板已按固定时长退出，或设备端不可达：明确告诉用户怎么再打开
    if (ttlAt){
      ttlAt = 0;
      $('ttlInfo').textContent = '面板已关闭，点模块「操作」可重新打开';
    }
  }
}

async function loadLog(){
  try{ $('log').textContent = await apiLog(); }catch(e){ $('log').textContent = '读取日志失败'; }
}

$('save').addEventListener('click', async () => {
  const btn = $('save'), msg = $('msg');
  btn.disabled = true;
  msg.className = 'msg';
  msg.textContent = '正在保存…';
  try{
    const r = await apiSet(+uR.value, +lR.value);
    if (r.ok){
      saved = {u: r.upper, l: r.lower};
      uR.value = r.upper; lR.value = r.lower;
      msg.className = 'msg ok';
      msg.textContent = '✓ ' + r.msg;
      setTimeout(loadLog, 1200);
    }else{
      msg.className = 'msg err';
      msg.textContent = '✕ ' + (r.msg || '保存失败');
    }
  }catch(e){
    msg.className = 'msg err';
    msg.textContent = '✕ 无法写入配置：' + e.message;
  }
  paint();
});

paint();
refresh();
loadLog();
setInterval(refresh, 3000);
setInterval(loadLog, 15000);
setInterval(paintTtl, 1000);
</script>
</body>
</html>
